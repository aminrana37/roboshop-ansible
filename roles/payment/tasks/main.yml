
---
- name: Install Python dependencies
  ansible.builtin.dnf:
    name:
      - python3
      - python3-pip
      - python3-devel
      - gcc
    state: present

- name: Create application user
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /sbin/nologin
    create_home: false
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_directory }}"
    state: directory

- name: Download and extract application
  ansible.builtin.include_role:
    name: common
    tasks_from: download_extract

- name: Set application ownership
  ansible.builtin.file:
    path: "{{ app_directory }}"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    recurse: true

- name: Install Payment Python requirements
  ansible.builtin.pip:
    requirements: "{{ app_directory }}/requirements.txt"
    virtualenv: "{{ payment_venv }}"
    virtualenv_command: /usr/bin/python3 -m venv

- name: Configure Payment systemd service
  ansible.builtin.template:
    src: payment.service.j2
    dest: /etc/systemd/system/payment.service

- name: Enable and start Payment
  ansible.builtin.systemd_service:
    name: payment
    state: started
    enabled: true
    daemon_reload: true
