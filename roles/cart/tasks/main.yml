- name: Disable {{ app_name }} module and enable version
  ansible.builtin.include_role:
    name: common
    tasks_from: diseninst
  vars:
    app_name: {{ app_name }}
    app_version: {{ app_version }}

- name: Create application user
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /sbin/nologin
    create_home: false
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_directory }}"
    state: directory

- name: Download and extract application
  ansible.builtin.include_role:
    name: common
    tasks_from: download_extract

- name: Install NodeJS dependencies
  community.general.npm:
    path: "{{ app_directory }}"
    state: present

- name: Configure Cart service
  ansible.builtin.template:
    src: cart.service.j2
    dest: /etc/systemd/system/cart.service

- name: Enable and start Cart
  ansible.builtin.systemd_service:
    name: cart
    enabled: true
    state: started
    daemon_reload: true