
---
- name: Install MySQL Server
  ansible.builtin.dnf:
    name: "{{ mysql_package }}"
    state: present

- name: Start and enable MySQL
  ansible.builtin.systemd_service:
    name: "{{ mysql_service }}"
    state: started
    enabled: true

- name: Check MySQL root authentication
  ansible.builtin.command:
    argv:
      - mysql
      - -uroot
      - "-p{{ mysql_root_password }}"
      - -e
      - "SELECT 1"
  register: mysql_root_check
  changed_when: false
  failed_when: false
  no_log: true

- name: Set MySQL root password
  ansible.builtin.command:
    argv:
      - mysql_secure_installation
      - --set-root-pass
      - "{{ mysql_root_password }}"
  when: mysql_root_check.rc != 0
  no_log: true
