---
- name: Disable {{ app_name }} module
  ansible.builtin.command:
    cmd: dnf module disable {{ app_name }} -y
  when: app_version is defined and app_version | length > 0

- name: Enable {{ app_name }} module version
  ansible.builtin.command:
    cmd: dnf module enable {{ app_name }}:{{ app_version }} -y
  when: app_version is defined and app_version | length > 0

- name: Install {{ app_name }}
  ansible.builtin.dnf:
    name: "{{ app_name }}"
    state: present