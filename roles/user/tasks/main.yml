- name: Disable {{ app_name }} module and enable version
  ansible.builtin.include_role:
    name: common
    tasks_from: diseninst

- name: Create application user
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /sbin/nologin
    create_home: false
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_directory }}"
    state: directory

- name: Download and extract application
  ansible.builtin.include_role:
    name: common
    tasks_from: download_extract

- name: Install NodeJS dependencies
  community.general.npm:
    path: "{{ app_directory }}"
    state: present

- name: Configure User service
  ansible.builtin.template:
    src: user.service.j2
    dest: /etc/systemd/system/user.service

- name: Enable and start User
  ansible.builtin.systemd_service:
    name: user
    enabled: true
    state: started
    daemon_reload: true